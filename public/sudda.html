<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF HUB - ADMIN PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }
        .gaming-font { font-family: 'Orbitron', sans-serif; }
        .neon-border { box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); border: 1px solid rgba(249, 115, 22, 0.4); }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-center items-center px-4 text-gray-100">

    <div class="w-full max-w-md bg-black/80 p-8 rounded-2xl neon-border backdrop-blur-md">
        <div class="text-center mb-6">
            <h1 class="gaming-font text-2xl font-black text-orange-500 uppercase tracking-wider">
                ⚙️ HUB CONTROLLER
            </h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Official Tournament Administration</p>
        </div>

        <form id="adminForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Secret Admin Password</label>
                <input type="password" id="admin_pass" placeholder="Enter secret key..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Next Match Date & Time</label>
                <input type="datetime-local" id="admin_time" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Live Match Status</label>
                <select id="admin_status" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
                    <option value="LIVE">LIVE NOW 🔴</option>
                    <option value="UPCOMING">UPCOMING ⏳</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Ticker Alert Message</label>
                <input type="text" id="admin_msg" placeholder="e.g. GRAND FINALS IS STARTING SOON!" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Match Map</label>
                <input type="text" id="admin_map" placeholder="e.g. BERMUDA (CLASSIC)" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
            </div>
            
            <button type="submit" id="adminBtn" class="w-full gaming-font bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 text-white font-black py-3 rounded-lg text-sm uppercase tracking-wider transition-all shadow-lg shadow-orange-900/20">
                Update Live Dashboard
            </button>
        </form>
        
        <p id="adminMessage" class="mt-4 text-center text-xs font-semibold hidden"></p>
    </div>

    <script>
        // 🚀 සයිට් එක හොස්ට් කරලා තියෙන ලින්ක් එක auto ම ගන්නවා, එතකොට කිසිම Network Error එකක් එන්නේ නැහැ!
        const API_URL = window.location.origin;

        // සයිට් එක ලෝඩ් වෙද්දීම දැනට සර්වර් එකේ තියෙන විස්තර ටික auto පිරෙන කොටස
        window.onload = async function() {
            try {
                const response = await fetch(`${API_URL}/api/settings`);
                if (!response.ok) return;
                const settings = await response.json();
                
                document.getElementById('admin_time').value = settings.nextMatchTime || "";
                document.getElementById('admin_status').value = settings.liveStatus || "UPCOMING";
                document.getElementById('admin_msg').value = settings.matchMessage || "";
                document.getElementById('admin_map').value = settings.matchMap || "";
            } catch (error) { console.error("Error loading current settings:", error); }
        };

        // දත්ත සර්වර් එකට යවන කොටස
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('adminBtn');
            const msgEl = document.getElementById('adminMessage');

            const adminPassword = document.getElementById('admin_pass').value;
            const nextMatchTime = document.getElementById('admin_time').value;
            const liveStatus = document.getElementById('admin_status').value;
            const matchMessage = document.getElementById('admin_msg').value.trim();
            const matchMap = document.getElementById('admin_map').value.trim();

            btn.disabled = true;
            btn.innerText = "Transmitting Data...";
            msgEl.classList.add('hidden'); // පරණ මැසේජ් හැංගීම

            try {
                const response = await fetch(`${API_URL}/api/settings/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword, nextMatchTime, liveStatus, matchMessage, matchMap })
                });
                const data = await response.json();

                if(response.ok) {
                    msgEl.className = "mt-4 text-center text-xs font-semibold block text-green-400 bg-green-500/10 p-3 rounded-lg border border-green-500/20";
                    msgEl.innerText = data.message;
                    document.getElementById('admin_pass').value = ''; // Password එක විතරක් ක්ලියර් කරනවා
                } else {
                    msgEl.className = "mt-4 text-center text-xs font-semibold block text-red-400 bg-red-500/10 p-3 rounded-lg border border-red-500/20";
                    msgEl.innerText = data.message || "Something went wrong!";
                }
            } catch (error) { 
                console.error("Submit Error:", error);
                msgEl.className = "mt-4 text-center text-xs font-semibold block text-red-400 bg-red-500/10 p-3 rounded-lg border border-red-500/20";
                msgEl.innerText = "Network Error! Please check server connection."; 
            }
            finally { btn.disabled = false; btn.innerText = "Update Live Dashboard"; }
        });
    </script>
<!-- ================= PLAYER MANAGEMENT PANEL ================= -->
<div class="w-full max-w-md bg-black/80 p-6 rounded-2xl border border-red-500/30 backdrop-blur-md shadow-xl mt-6">
    <h2 class="gaming-font text-lg font-bold text-red-500 mb-4 border-b border-red-500/20 pb-2 uppercase flex items-center gap-2">
        <span>🚫 PLAYER CONTROL CENTER</span>
    </h2>
    <form id="playerControlForm" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Player WhatsApp Number</label>
            <input type="text" id="target_whatsapp" placeholder="947XXXXXXXX" required class="w-full bg-gray-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-red-500">
        </div>
        
        <!-- POINTS UPDATE SECTION -->
        <div class="bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Set New Rank Points</label>
            <div class="flex gap-2">
                <input type="number" id="new_points" placeholder="e.g. 1500" class="w-full bg-gray-950 border border-zinc-800 rounded-lg p-2 text-sm text-white focus:outline-none">
                <button type="button" onclick="updatePlayerPoints()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold px-4 py-2 rounded text-xs uppercase tracking-wide transition-all">Update</button>
            </div>
        </div>

        <!-- BAN / UNBAN BUTTONS -->
        <div class="grid grid-cols-2 gap-3 pt-2">
            <button type="button" onclick="togglePlayerBan(true)" class="bg-red-700 hover:bg-red-600 text-white font-black py-3 rounded-lg text-xs uppercase tracking-wider transition-all shadow-md">
                🚨 BAN PLAYER
            </button>
            <button type="button" onclick="togglePlayerBan(false)" class="bg-green-700 hover:bg-green-600 text-white font-black py-3 rounded-lg text-xs uppercase tracking-wider transition-all shadow-md">
                ✅ UNBAN PLAYER
            </button>
        </div>
    </form>
    <p id="controlMessage" class="mt-4 text-center text-xs font-semibold hidden"></p>
</div>

<!-- JavaScript Logic ටික admin.html එකේ <script> ටැග් එක ඇතුළට දාන්න -->
<script>
    // 1. POINTS UPDATE FUNCTION
    async function updatePlayerPoints() {
        const adminPassword = document.getElementById('admin_password').value.trim(); // ඔයාගේ ඇඩ්මින් පාස්වර්ඩ් ෆීල්ඩ් එකේ ID එක බලන්න
        const whatsapp = document.getElementById('target_whatsapp').value.trim();
        const newPoints = document.getElementById('new_points').value.trim();
        const msgEl = document.getElementById('controlMessage');

        if(!adminPassword || !whatsapp || !newPoints) {
            alert("Please fill Admin Password, Player WhatsApp, and New Points!");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/api/admin/update-points`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword, whatsapp, newPoints })
            });
            const data = await response.json();
            
            msgEl.className = `mt-4 text-center text-xs font-semibold block p-3 rounded-lg ${response.ok ? 'text-green-400 bg-green-500/10 border border-green-500/20' : 'text-red-400 bg-red-500/10 border border-red-500/20'}`;
            msgEl.innerText = data.message;
        } catch (error) {
            msgEl.innerText = "Error connecting to server!";
        }
    }

    // 2. BAN / UNBAN TOGGLE FUNCTION
    async function togglePlayerBan(isBanned) {
        const adminPassword = document.getElementById('admin_password').value.trim();
        const whatsapp = document.getElementById('target_whatsapp').value.trim();
        const msgEl = document.getElementById('controlMessage');

        if(!adminPassword || !whatsapp) {
            alert("Please fill Admin Password and Player WhatsApp Number!");
            return;
        }

        const confirmAction = confirm(`Are you sure you want to ${isBanned ? 'BAN' : 'UNBAN'} this player?`);
        if(!confirmAction) return;

        try {
            const response = await fetch(`${API_URL}/api/admin/toggle-ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword, whatsapp, isBanned })
            });
            const data = await response.json();
            
            msgEl.className = `mt-4 text-center text-xs font-semibold block p-3 rounded-lg ${response.ok ? 'text-yellow-400 bg-yellow-500/10 border border-yellow-500/20' : 'text-red-400 bg-red-500/10 border border-red-500/20'}`;
            msgEl.innerText = data.message;
        } catch (error) {
            msgEl.innerText = "Error connecting to server!";
        }
    }
</script>
    
</body>
</html>
