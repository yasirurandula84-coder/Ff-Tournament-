<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF HUB - ADMIN PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }
        .gaming-font { font-family: 'Orbitron', sans-serif; }
        .neon-border { box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); border: 1px solid rgba(249, 115, 22, 0.4); }
        .active-tab { background: linear-gradient(to right, #ea580c, #dc2626); color: white; border-color: transparent; }
        /* Custom scrollbar for player list */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #ea580c; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-center items-center px-4 py-8 text-gray-100">

    <div class="w-full max-w-2xl bg-black/80 p-6 rounded-2xl neon-border backdrop-blur-md transition-all duration-300">
        
        <!-- HEADER -->
        <div class="text-center mb-6">
            <h1 class="gaming-font text-2xl font-black text-orange-500 uppercase tracking-wider">
                ⚙️ HUB CONTROLLER
            </h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Official Tournament Administration</p>
        </div>

        <!-- SECRET PASSWORD -->
        <div class="mb-6 bg-zinc-900/40 p-3 rounded-xl border border-zinc-800/60">
            <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Secret Admin Password</label>
            <input type="password" id="admin_pass" placeholder="Enter secret key..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
        </div>

        <!-- NAVIGATION TABS -->
        <div class="grid grid-cols-2 gap-2 mb-6 border-b border-zinc-800 pb-4">
            <button onclick="switchTab('dashboard-tab')" id="btn-dashboard-tab" class="active-tab gaming-font py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all border border-zinc-800 text-gray-400 hover:text-white">
                📢 Updates Panel
            </button>
            <button onclick="switchTab('player-tab')" id="btn-player-tab" class="gaming-font py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all border border-zinc-800 text-gray-400 hover:text-white">
                🚫 Edit System
            </button>
        </div>

        <!-- ================= TAB 1: DASHBOARD UPDATES ================= -->
        <div id="dashboard-tab" class="tab-content space-y-4">
            <form id="adminForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Next Match Date & Time</label>
                    <input type="datetime-local" id="admin_time" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Live Match Status</label>
                    <select id="admin_status" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
                        <option value="LIVE">LIVE NOW 🔴</option>
                        <option value="UPCOMING">UPCOMING ⏳</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Ticker Alert Message</label>
                    <input type="text" id="admin_msg" placeholder="e.g. GRAND FINALS IS STARTING SOON!" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Match Map</label>
                    <input type="text" id="admin_map" placeholder="e.g. BERMUDA (CLASSIC)" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-orange-500">
                </div>
                
                <button type="submit" id="adminBtn" class="w-full gaming-font bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 text-white font-black py-3 rounded-lg text-sm uppercase tracking-wider transition-all shadow-lg shadow-orange-900/20">
                    Update Live Dashboard
                </button>
            </form>
            <p id="adminMessage" class="mt-4 text-center text-xs font-semibold hidden"></p>
        </div>

        <!-- ================= TAB 2: EDIT SYSTEM (PLAYER LIST CONTROLLER) ================= -->
        <div id="player-tab" class="tab-content space-y-4 hidden">
            <div class="flex justify-between items-center mb-2">
                <h3 class="gaming-font text-sm font-bold text-zinc-400 uppercase tracking-wide">Registered Player Base</h3>
                <button onclick="loadPlayerList()" class="bg-zinc-800 hover:bg-zinc-700 text-orange-500 font-bold px-3 py-1.5 rounded-lg text-xs uppercase tracking-wider transition-all border border-zinc-700">
                    🔄 Load Players List
                </button>
            </div>

            <!-- PLAYER LIST CONTAINER -->
            <div class="border border-zinc-800 rounded-xl overflow-hidden bg-zinc-950/40">
                <div class="max-h-80 overflow-y-auto custom-scroll">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-zinc-900/80 border-b border-zinc-800 text-[11px] font-bold text-zinc-400 uppercase tracking-wider">
                                <th class="p-3">Player / WhatsApp</th>
                                <th class="p-3 text-center">Points (Click to Edit)</th>
                                <th class="p-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="playerListBody">
                            <tr>
                                <td colspan="3" class="text-center p-8 text-sm text-zinc-500 uppercase tracking-wider">Click "Load Players List" to fetch data</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <p id="controlMessage" class="mt-4 text-center text-xs font-semibold block p-3 rounded-lg hidden"></p>
        </div>

    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        const API_URL = window.location.origin;

        // 🔄 TAB SWITCHING
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.getElementById('btn-dashboard-tab').className = "gaming-font py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all border border-zinc-800 text-gray-400 hover:text-white";
            document.getElementById('btn-player-tab').className = "gaming-font py-2.5 rounded-lg text-xs font-bold uppercase tracking-wider transition-all border border-zinc-800 text-gray-400 hover:text-white";

            document.getElementById(`btn-${tabId}`).classList.add('active-tab');
        }

        // LOAD DASHBOARD DATA ON REFRESH
        window.onload = async function() {
            try {
                const response = await fetch(`${API_URL}/api/settings`);
                if (!response.ok) return;
                const settings = await response.json();
                
                document.getElementById('admin_time').value = settings.nextMatchTime || "";
                document.getElementById('admin_status').value = settings.liveStatus || "UPCOMING";
                document.getElementById('admin_msg').value = settings.matchMessage || "";
                document.getElementById('admin_map').value = settings.matchMap || "";
            } catch (error) { console.error("Error loading settings:", error); }
        };

        // 📢 UPDATE DASHBOARD SETTINGS
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('adminBtn');
            const msgEl = document.getElementById('adminMessage');
            const adminPassword = document.getElementById('admin_pass').value;

            btn.disabled = true;
            btn.innerText = "Transmitting Data...";
            msgEl.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}/api/settings/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        adminPassword,
                        nextMatchTime: document.getElementById('admin_time').value,
                        liveStatus: document.getElementById('admin_status').value,
                        matchMessage: document.getElementById('admin_msg').value.trim(),
                        matchMap: document.getElementById('admin_map').value.trim()
                    })
                });
                const data = await response.json();
                msgEl.className = `mt-4 text-center text-xs font-semibold block p-3 rounded-lg ${response.ok ? 'text-green-400 bg-green-500/10 border border-green-500/20' : 'text-red-400 bg-red-500/10 border border-red-500/20'}`;
                msgEl.innerText = data.message;
            } catch (error) { 
                msgEl.className = "mt-4 text-center text-xs font-semibold block p-3 rounded-lg text-red-400 bg-red-500/10 border border-red-500/20";
                msgEl.innerText = "Network Error!"; 
            } finally { btn.disabled = false; btn.innerText = "Update Live Dashboard"; }
        });

        // 🔄 FETCH AND RENDER PLAYER LIST
        async function loadPlayerList() {
            const adminPassword = document.getElementById('admin_pass').value.trim();
            const tbody = document.getElementById('playerListBody');
            
            if(!adminPassword) {
                alert("Please input Secret Admin Password first!");
                return;
            }

            tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-xs text-orange-500 uppercase tracking-widest animate-pulse">Fetching Database rows...</td></tr>`;

            try {
                const response = await fetch(`${API_URL}/api/admin/players`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword })
                });
                
                if(!response.ok) {
                    const errData = await response.json();
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-sm text-red-500">${errData.message || 'Failed to load'}</td></tr>`;
                    return;
                }

                const players = await response.json();
                if(players.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-sm text-zinc-500">No players found in Database.</td></tr>`;
                    return;
                }

                tbody.innerHTML = ""; // Clear table
                players.forEach(p => {
                    const row = document.createElement('tr');
                    row.className = "border-b border-zinc-900 hover:bg-zinc-900/30 text-sm transition-all";
                    
                    // Ban configuration status styles
                    const banBadge = p.isBanned ? `<span class="text-[10px] bg-red-500/10 text-red-500 px-1.5 py-0.5 rounded border border-red-500/20 font-bold ml-1">BANNED</span>` : "";

                    row.innerHTML = `
                        <td class="p-3 font-semibold">
                            <div class="text-white flex items-center">${p.ff_name} ${banBadge}</div>
                            <div class="text-zinc-500 text-xs">${p.whatsapp}</div>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="promptPointsUpdate('${p.whatsapp}', '${p.ff_name}', ${p.points})" class="gaming-font font-bold text-yellow-500 hover:text-yellow-400 bg-yellow-500/5 hover:bg-yellow-500/10 border border-yellow-500/10 px-4 py-1.5 rounded-lg transition-all cursor-pointer">
                                🪙 ${p.points}
                            </button>
                        </td>
                        <td class="p-3 text-center">
                            <div class="flex justify-center gap-1.5">
                                <button onclick="actionToggleBan('${p.whatsapp}', true)" class="bg-red-950/40 hover:bg-red-600 text-red-500 hover:text-white font-bold px-2.5 py-1.5 rounded-md text-xs uppercase tracking-wide border border-red-900/40 transition-all">Ban</button>
                                <button onclick="actionToggleBan('${p.whatsapp}', false)" class="bg-green-950/40 hover:bg-green-600 text-green-500 hover:text-white font-bold px-2.5 py-1.5 rounded-md text-xs uppercase tracking-wide border border-green-900/40 transition-all">Unban</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center p-8 text-sm text-red-500">Error loading data stream.</td></tr>`;
            }
        }

        // 🪙 CLICK TO EDIT COINS/POINTS FUNCTION
        async function promptPointsUpdate(whatsapp, name, currentPoints) {
            const adminPassword = document.getElementById('admin_pass').value.trim();
            const newPoints = prompt(`Edit Points for ${name} (${whatsapp}):`, currentPoints);
            
            if (newPoints === null || newPoints === "") return; // If cancel or empty
            if (isNaN(newPoints)) { alert("Please enter a valid number!"); return; }

            showControlMsg("Updating player table entry...", "text-yellow-400 bg-yellow-500/10");

            try {
                const response = await fetch(`${API_URL}/api/admin/update-points`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword, whatsapp, newPoints })
                });
                const data = await response.json();
                
                if(response.ok) {
                    showControlMsg(data.message, "text-green-400 bg-green-500/10 border border-green-500/20");
                    loadPlayerList(); // Reload table data smoothly
                } else {
                    showControlMsg(data.message, "text-red-400 bg-red-500/10 border border-red-500/20");
                }
            } catch (error) { showControlMsg("Server communication breakdown.", "text-red-400 bg-red-500/10"); }
        }

        // 🚫 ACTIONS FOR BAN / UNBAN BUTTONS
        async function actionToggleBan(whatsapp, isBanned) {
            const adminPassword = document.getElementById('admin_pass').value.trim();
            const confirmAction = confirm(`Execute accounts policy: ${isBanned ? 'BAN' : 'UNBAN'} player ${whatsapp}?`);
            if(!confirmAction) return;

            showControlMsg("Processing restriction logic...", "text-yellow-400 bg-yellow-500/10");

            try {
                const response = await fetch(`${API_URL}/api/admin/toggle-ban`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword, whatsapp, isBanned })
                });
                const data = await response.json();
                
                if(response.ok) {
                    showControlMsg(data.message, "text-orange-400 bg-orange-500/10 border border-orange-500/20");
                    loadPlayerList(); // Update user table UI immediately
                } else {
                    showControlMsg(data.message, "text-red-400 bg-red-500/10 border border-red-500/20");
                }
            } catch (error) { showControlMsg("Server communication breakdown.", "text-red-400 bg-red-500/10"); }
        }

        // Helper function for quick validation logs
        function showControlMsg(text, classes) {
            const msgEl = document.getElementById('controlMessage');
            msgEl.className = `mt-4 text-center text-xs font-semibold block p-3 rounded-lg ${classes}`;
            msgEl.innerText = text;
            msgEl.classList.remove('hidden');
        }
    </script>
</body>
</html>
